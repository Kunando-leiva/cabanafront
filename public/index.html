<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Complejo Los Alerces - Cabañas en Libertad, Merlo"
    />
    
    <!-- REMOVER o COMENTAR manifest.json temporalmente -->
    <!-- <link rel="manifest" href="%PUBLIC_URL%/manifest.json" /> -->
    
    <title>Complejo Los Alerces</title>
    
    <!-- Prevenir zoom en dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    
    <!-- Estilos críticos inline -->
    <style>
      /* Prevenir flashes y errores de renderizado */
      body, #root {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      
      /* Estilos específicos para react-calendar */
      .react-calendar {
        isolation: isolate;
        contain: content;
      }
      
      .react-calendar__tile {
        will-change: transform;
        backface-visibility: hidden;
      }
    </style>
  </head>
  <body>
    <noscript>Necesitas habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
